<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringCal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ringPro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ringCarb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Ring: Calories (Cyan) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="24" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ringCal)" stroke-width="24" stroke-linecap="round" stroke-dasharray="1068" stroke-dashoffset="240" filter="url(#glow)" transform="rotate(-90 256 256)" />

  <!-- Middle Ring: Protein (Emerald) -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="rgba(52, 211, 153, 0.15)" stroke-width="22" />
  <circle cx="256" cy="256" r="128" fill="none" stroke="url(#ringPro)" stroke-width="22" stroke-linecap="round" stroke-dasharray="804" stroke-dashoffset="180" filter="url(#glow)" transform="rotate(-90 256 256)" />

  <!-- Inner Ring: Carbs & Fat (Amber) -->
  <circle cx="256" cy="256" r="88" fill="none" stroke="rgba(251, 191, 36, 0.15)" stroke-width="20" />
  <circle cx="256" cy="256" r="88" fill="none" stroke="url(#ringCarb)" stroke-width="20" stroke-linecap="round" stroke-dasharray="552" stroke-dashoffset="120" filter="url(#glow)" transform="rotate(-90 256 256)" />

  <!-- Center Sparkle / AI Nutrition Core -->
  <circle cx="256" cy="256" r="32" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  <path d="M256 236 L262 250 L276 256 L262 262 L256 276 L250 262 L236 256 L250 250 Z" fill="#38bdf8" />
</svg>
